<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Gamewish: sua wishlist de games</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link
      rel="alternate icon"
      href="%sveltekit.assets%/favicon.ico"
      type="image/x-icon"
    />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="%sveltekit.assets%/favicon-192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="%sveltekit.assets%/favicon-512.png"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Gamewish: sua wishlist de games com dados da RAWG. Explore o catalogo, filtre por genero e plataforma e guarde seus favoritos."
    />
    <meta name="theme-color" content="#06080e" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Gamewish" />
    <meta
      property="og:title"
      content="Gamewish: sua wishlist de games"
    />
    <meta
      property="og:description"
      content="Explore milhares de jogos com dados da RAWG, filtre por gênero e plataforma e monte sua coleção."
    />
    <meta property="og:image" content="%sveltekit.assets%/favicon-512.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Gamewish: sua wishlist de games" />
    <meta
      name="twitter:description"
      content="Explore o catálogo RAWG e guarde seus jogos favoritos na sua coleção viva."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.json" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="app-shell">%sveltekit.body%</div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js').catch((err) => {
            console.log('Service Worker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
